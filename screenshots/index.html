<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Retail Sales Dashboard screenshots</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 40px; background: #F6F5FA; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1D1B26; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p.sub { margin: 0 0 32px; color: #6B6880; font-size: 13px; }
  .shot { margin-bottom: 44px; }
  .shot h2 { font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: #6D28D9; margin: 0 0 12px; }
  .shot img { display: block; width: 100%; max-width: 1100px; border: 1px solid #E3E0EC; border-radius: 14px; box-shadow: 0 24px 60px -40px rgba(50, 30, 90, 0.5); background: #fff; }
</style>
</head>
<body>
  <h1>Retail Sales Dashboard</h1>
  <p class="sub">One full-page capture per tab, 1440 px wide.</p>
  <div class="shot"><h2>01 / Overview</h2><img src="overview.png" alt="Overview"></div>
  <div class="shot"><h2>02 / Products</h2><img src="products.png" alt="Products"></div>
  <div class="shot"><h2>03 / Stores</h2><img src="stores.png" alt="Stores"></div>
  <div class="shot"><h2>04 / Time</h2><img src="time.png" alt="Time"></div>
  <div class="shot"><h2>05 / Returns</h2><img src="returns.png" alt="Returns"></div>
  <div class="shot"><h2>06 / Forecast</h2><img src="forecast.png" alt="Forecast"></div>
</body>
</html>
